[package]
name = "pywezterm-core"
version = "0.1.0"
edition = "2018"
description = "Terminal host: pty engine, emulator model, render and multiplexer. No Python dependency."
license = "MIT"

[lib]
name = "pywezterm_core"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
log.workspace = true
portable-pty.workspace = true
termwiz.workspace = true
wezterm-term.workspace = true
wezterm-surface.workspace = true
wezterm-char-props.workspace = true
wezterm-escape-parser.workspace = true
tiny-skia.workspace = true
image.workspace = true
fontdb = "0.23"
fontdue = "0.9"

[target."cfg(unix)".dependencies]
libc.workspace = true

[target."cfg(windows)".dependencies]
winapi = { workspace = true, features = [
    "minwindef",
    "winbase",
    "winnt",
    "ioapiset",
    "handleapi",
    "processthreadsapi",
    "processenv",
    "libloaderapi",
    "consoleapi",
    "wincon",
    "synchapi",
    "winuser",
] }
