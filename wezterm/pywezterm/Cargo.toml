[package]
name = "pywezterm"
version = "0.1.0"
edition = "2018"
description = "wezterm terminal engine as a Python extension module (pyo3/abi3)"
license = "MIT"

[lib]
name = "pywezterm"
crate-type = ["cdylib"]

[dependencies]
pyo3.workspace = true
pywezterm-core = { path = "../pywezterm-core" }
# 回调适配要 impl 模型自身的 handler trait
wezterm-term.workspace = true
wezterm-escape-parser.workspace = true
anyhow.workspace = true
log.workspace = true
